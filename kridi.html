<style>
/* Layout: one narrow column like a pocket ledger, squared-paper ground, bottom tab bar. */
:root {
  --bg: #EEF3F9;
  --grid: #D8E1EC;
  --card: #FFFFFF;
  --fg: #14213D;
  --muted: #5B6B84;
  --line: #C9D4E3;
  --ink: #1D3FA8;
  --ink-soft: #E3EAFB;
  --on-ink: #FFFFFF;
  --debt: #C0352B;
  --debt-soft: #FBE7E4;
  --ok: #1C7A4B;
  --ok-soft: #DDF3E8;
  --warn: #8A5200;
  --warn-soft: #FCEFD3;
  --f-display: 'Cairo', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1422; --grid: #18223A; --card: #151D31; --fg: #E7ECF8; --muted: #97A5C0;
    --line: #2A3656; --ink: #86A6FF; --ink-soft: #1B2850; --on-ink: #0E1422;
    --debt: #FF8F85; --debt-soft: #3A1E24; --ok: #6FD6A0; --ok-soft: #173528;
    --warn: #F0B964; --warn-soft: #3A2D14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1422; --grid: #18223A; --card: #151D31; --fg: #E7ECF8; --muted: #97A5C0;
  --line: #2A3656; --ink: #86A6FF; --ink-soft: #1B2850; --on-ink: #0E1422;
  --debt: #FF8F85; --debt-soft: #3A1E24; --ok: #6FD6A0; --ok-soft: #173528;
  --warn: #F0B964; --warn-soft: #3A2D14; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 12px 108px;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1.2; margin: 0; color: var(--ink); text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: .88rem; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-weight: 600; font-size: .85rem; color: var(--ink); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.status { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.local { background: var(--warn); }
.dot.err { background: var(--debt); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner button { border: 1.5px solid currentColor; background: transparent; border-radius: 8px; padding: 6px 10px; font-weight: 600; min-height: 36px; }
.hero { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; }
.hero .lbl { color: var(--muted); font-size: .9rem; }
.hero .big { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1.15; color: var(--debt); font-variant-numeric: tabular-nums; }
.hero .big small { font-size: 1.1rem; font-weight: 600; margin-inline-start: 6px; }
.hero .sub { color: var(--muted); font-size: .9rem; }
.tools { display: flex; gap: 8px; }
.tools input { flex: 1; min-width: 0; }
input[type=text], input[type=search], input[type=tel], input[type=number] {
  width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
input::placeholder { color: var(--muted); }
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--on-ink); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.debt { background: var(--debt); border-color: var(--debt); color: var(--card); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--card); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.list { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list li[hidden] { display: none; }
.row { display: flex; align-items: baseline; gap: 8px; width: 100%; border: 0; background: transparent; padding: 14px 14px; text-align: start; min-height: 52px; }
.row:hover { background: var(--ink-soft); }
.row .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .lead { flex: 1; border-bottom: 2px dotted var(--line); min-width: 12px; transform: translateY(-4px); }
.amt { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.debt { color: var(--debt); }
.amt.ok { color: var(--ok); }
.chip { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .78rem; font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.low { background: var(--debt-soft); color: var(--debt); }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; margin: 0; color: var(--ink); }
.pair { display: flex; gap: 10px; }
.pair > * { flex: 1; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kv span:first-child { color: var(--muted); }
.prod { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.prod .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.prod .nm { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.prod .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.step button { border: 0; background: var(--ink-soft); color: var(--ink); width: 44px; height: 44px; font-size: 1.3rem; font-weight: 800; }
.step output { min-width: 52px; text-align: center; font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.minbox { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
.minbox input { width: 72px; min-height: 40px; padding: 6px 8px; }
.x { border: 0; background: transparent; color: var(--muted); min-height: 36px; padding: 4px 8px; font-size: .85rem; text-decoration: underline; }
.x.armed { color: var(--debt); font-weight: 600; }
.tabs { position: fixed; inset-inline: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 6px; z-index: 5; }
.tabs button { flex: 1; max-width: 180px; border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .8rem; font-weight: 600; min-height: 52px; }
.tabs button[aria-current="page"] { background: var(--ink-soft); color: var(--ink); }
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ov { position: fixed; inset: 0; background: rgba(8, 14, 30, .55); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; border: 1.5px solid var(--line); }
.sheet .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet .hd h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .85rem; color: var(--muted); font-weight: 500; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.hist .d { color: var(--muted); font-size: .8rem; min-width: 52px; }
.hist .n { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .9rem; }
.mini { color: var(--muted); font-size: .8rem; }
@media (prefers-reduced-motion: no-preference) { .ov { animation: fade .15s ease-out; } @keyframes fade { from { opacity: 0; } } }
</style>

<div id="app" class="wrap"></div>

<script>
(function () {
  'use strict';

  var T = {
    ar: {
      app: 'دفتر الكريدي', sub: 'ديون الزبناء ومخزون المحل',
      tabDebts: 'الكريدي', tabStock: 'المخزون', tabToday: 'اليوم',
      owedTotal: 'مجموع الكريدي عند الزبناء', owingCount: '{n} زبناء عليهم دين',
      addCustomer: 'زبون جديد', name: 'الاسم', phone: 'رقم الهاتف (واتساب)', phoneHint: 'مثال: 0612345678',
      save: 'حفظ', cancel: 'إلغاء', addDebt: 'تسجيل دين', addPay: 'تسجيل دفعة', amount: 'المبلغ',
      note: 'ملاحظة (اختياري)', balance: 'الباقي', settled: 'خالص', history: 'السجل',
      remind: 'تذكير بالواتساب', needPhone: 'أضف رقم الهاتف للتذكير', noCustomers: 'لا يوجد زبناء بعد. أضف أول زبون.',
      search: 'بحث عن زبون', del: 'حذف', confirmDel: 'اضغط مرة أخرى للحذف',
      demo: 'هذه بيانات تجريبية للتعرف على التطبيق.', clearDemo: 'ابدأ بدفتر فارغ',
      addProduct: 'منتج جديد', product: 'اسم المنتج', qty: 'الكمية', min: 'تنبيه تحت', low: 'ناقص', ok: 'متوفر',
      noProducts: 'لا توجد منتجات بعد.', shopList: 'قائمة المشتريات', nothingLow: 'لا شيء ناقص الآن.',
      copyList: 'نسخ القائمة', copied: 'تم النسخ',
      todayDebts: 'ديون اليوم', todayPaid: 'مدفوعات اليوم', topDebtors: 'أكبر الديون',
      dh: 'درهم', msg: 'السلام عليكم {name}، تذكير لطيف{from}: الباقي عليكم {amount} درهم. شكرا لكم.',
      fromWord: ' من ', shopName: 'اسم المحل (يظهر في رسالة التذكير)',
      saved: 'تم الحفظ', savedLocal: 'محفوظ على هذا الجهاز فقط', saveErr: 'تعذر الحفظ', loading: 'جاري التحميل',
      close: 'إغلاق', paid: 'دفعة', debt: 'دين', editHint: 'يمكنك تعديل الاسم والهاتف هنا', invalid: 'أدخل مبلغًا صحيحًا',
      nameReq: 'أدخل الاسم', lang: 'اللغة', unitLow: 'ناقص'
    },
    fr: {
      app: 'Carnet Kridi', sub: 'Crédits clients et stock du magasin',
      tabDebts: 'Crédits', tabStock: 'Stock', tabToday: 'Aujourd’hui',
      owedTotal: 'Total dû par les clients', owingCount: '{n} clients ont une dette',
      addCustomer: 'Nouveau client', name: 'Nom', phone: 'Téléphone (WhatsApp)', phoneHint: 'Ex. 0612345678',
      save: 'Enregistrer', cancel: 'Annuler', addDebt: 'Ajouter une dette', addPay: 'Ajouter un paiement', amount: 'Montant',
      note: 'Note (facultatif)', balance: 'Reste', settled: 'Soldé', history: 'Historique',
      remind: 'Rappel WhatsApp', needPhone: 'Ajoutez un numéro pour le rappel', noCustomers: 'Aucun client pour le moment. Ajoutez le premier.',
      search: 'Chercher un client', del: 'Supprimer', confirmDel: 'Appuyez encore pour supprimer',
      demo: 'Ce sont des exemples pour découvrir l’application.', clearDemo: 'Commencer avec un carnet vide',
      addProduct: 'Nouveau produit', product: 'Nom du produit', qty: 'Quantité', min: 'Alerte sous', low: 'Bas', ok: 'En stock',
      noProducts: 'Aucun produit pour le moment.', shopList: 'Liste de courses', nothingLow: 'Rien à racheter pour l’instant.',
      copyList: 'Copier la liste', copied: 'Copié',
      todayDebts: 'Dettes du jour', todayPaid: 'Paiements du jour', topDebtors: 'Plus grosses dettes',
      dh: 'DH', msg: 'Bonjour {name}, petit rappel{from} : il vous reste {amount} DH à régler. Merci !',
      fromWord: ' de la part de ', shopName: 'Nom du magasin (affiché dans le rappel)',
      saved: 'Enregistré', savedLocal: 'Enregistré sur cet appareil seulement', saveErr: 'Échec de l’enregistrement', loading: 'Chargement',
      close: 'Fermer', paid: 'Paiement', debt: 'Dette', editHint: 'Vous pouvez modifier le nom et le téléphone ici', invalid: 'Entrez un montant valide',
      nameReq: 'Entrez le nom', lang: 'Langue', unitLow: 'Bas'
    },
    en: {
      app: 'Kridi Ledger', sub: 'Customer credit and shop stock',
      tabDebts: 'Credit', tabStock: 'Stock', tabToday: 'Today',
      owedTotal: 'Total owed by customers', owingCount: '{n} customers owe money',
      addCustomer: 'New customer', name: 'Name', phone: 'Phone (WhatsApp)', phoneHint: 'e.g. 0612345678',
      save: 'Save', cancel: 'Cancel', addDebt: 'Add debt', addPay: 'Add payment', amount: 'Amount',
      note: 'Note (optional)', balance: 'Balance', settled: 'Settled', history: 'History',
      remind: 'WhatsApp reminder', needPhone: 'Add a phone number to send a reminder', noCustomers: 'No customers yet. Add the first one.',
      search: 'Search customers', del: 'Delete', confirmDel: 'Tap again to delete',
      demo: 'This is sample data so you can try the app.', clearDemo: 'Start with an empty ledger',
      addProduct: 'New product', product: 'Product name', qty: 'Quantity', min: 'Alert below', low: 'Low', ok: 'In stock',
      noProducts: 'No products yet.', shopList: 'Shopping list', nothingLow: 'Nothing to restock right now.',
      copyList: 'Copy list', copied: 'Copied',
      todayDebts: 'Debts today', todayPaid: 'Payments today', topDebtors: 'Largest debts',
      dh: 'MAD', msg: 'Hello {name}, a friendly reminder{from}: you still owe {amount} MAD. Thank you!',
      fromWord: ' from ', shopName: 'Shop name (shown in the reminder)',
      saved: 'Saved', savedLocal: 'Saved on this device only', saveErr: 'Could not save', loading: 'Loading',
      close: 'Close', paid: 'Payment', debt: 'Debt', editHint: 'You can edit the name and phone here', invalid: 'Enter a valid amount',
      nameReq: 'Enter a name', lang: 'Language', unitLow: 'Low'
    }
  };
  var LOCALE = { ar: 'ar-MA-u-nu-latn', fr: 'fr-FR', en: 'en-GB' };

  var $app = document.getElementById('app');
  var S = null;
  var ui = { tab: 'debts', sheet: null, kind: null, armed: null, toast: '', err: '' };
  var store = { ref: null, loaded: false, state: 'loading', dirty: false, busy: false, timer: 0 };

  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function t() { return T[S ? S.lang : 'ar']; }
  function fmt(n) { return new Intl.NumberFormat(LOCALE[S.lang], { maximumFractionDigits: 2 }).format(n); }
  function money(n) { return fmt(n) + ' ' + t().dh; }
  function dateStr(ts) { return new Intl.DateTimeFormat(LOCALE[S.lang], { day: 'numeric', month: 'short' }).format(new Date(ts)); }
  function bal(c) { return c.tx.reduce(function (a, x) { return a + (x.type === 'debt' ? x.amt : -x.amt); }, 0); }
  function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k] == null ? '' : o[k]; }); }
  function dayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function findC(id) { return S.customers.filter(function (c) { return c.id === id; })[0]; }
  function waNumber(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('00') === 0) return d.slice(2);
    if (d.charAt(0) === '0') return '212' + d.slice(1);
    if (d.length === 9) return '212' + d;
    return d;
  }

  function demoState(lang) {
    var now = Date.now(), day = 86400000;
    return {
      v: 1, lang: lang, demo: true, shop: '',
      customers: [
        { id: uid(), name: 'عمي حمو', phone: '0661000001', tx: [
          { id: uid(), t: now - 9 * day, type: 'debt', amt: 120, note: '' },
          { id: uid(), t: now - 4 * day, type: 'debt', amt: 85, note: '' },
          { id: uid(), t: now - 2 * day, type: 'pay', amt: 50, note: '' }] },
        { id: uid(), name: 'للا فاطمة', phone: '0661000002', tx: [
          { id: uid(), t: now - 6 * day, type: 'debt', amt: 300, note: '' },
          { id: uid(), t: now - 1 * day, type: 'debt', amt: 45, note: '' }] },
        { id: uid(), name: 'سي إدريس', phone: '', tx: [
          { id: uid(), t: now - 5 * day, type: 'debt', amt: 60, note: '' },
          { id: uid(), t: now - 3 * day, type: 'pay', amt: 60, note: '' }] }
      ],
      products: [
        { id: uid(), name: 'السكر', qty: 12, min: 5 },
        { id: uid(), name: 'زيت المائدة', qty: 3, min: 6 },
        { id: uid(), name: 'الشاي', qty: 8, min: 4 },
        { id: uid(), name: 'الحليب', qty: 2, min: 10 },
        { id: uid(), name: 'الدقيق', qty: 20, min: 5 }
      ]
    };
  }

  /* ---------- storage: db when available, localStorage mirror otherwise ---------- */
  function lsGet() { try { var v = localStorage.getItem('kridi-state'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet() { try { localStorage.setItem('kridi-state', JSON.stringify(S)); } catch (e) {} }
  function lsLang() { try { return localStorage.getItem('kridi-lang'); } catch (e) { return null; } }
  function lsSetLang(l) { try { localStorage.setItem('kridi-lang', l); } catch (e) {} }

  function save() {
    lsSet();
    store.dirty = true;
    store.state = store.ref ? 'loading' : 'local';
    clearTimeout(store.timer);
    store.timer = setTimeout(flush, 500);
  }
  function flush() {
    if (!store.ref || !store.loaded) { store.state = store.ref ? 'loading' : 'local'; paintStatus(); return; }
    if (store.busy || !store.dirty) return;
    store.busy = true; store.dirty = false;
    store.ref.set(JSON.parse(JSON.stringify(S))).then(function () {
      store.busy = false; store.state = store.dirty ? 'loading' : 'saved'; paintStatus();
      if (store.dirty) flush();
    }, function () {
      store.busy = false; store.state = 'err'; paintStatus();
    });
  }
  function paintStatus() {
    var el = document.getElementById('status'); if (!el) return;
    var k = store.state, lab = { saved: t().saved, local: t().savedLocal, err: t().saveErr, loading: t().loading }[k] || '';
    el.innerHTML = '<span class="dot ' + (k === 'local' ? 'local' : k === 'err' ? 'err' : '') + '"></span>' + esc(lab);
  }

  async function initStore() {
    var local = lsGet();
    try {
      if (!window.claude || !window.claude.use) throw new Error('no claude');
      var res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      var db = res[0], user = res[1];
      var id = user ? await user.id() : null;
      if (db && id) {
        var ref = db.doc('data/users/' + id + '/ledger');
        var snap = await ref.get();
        store.ref = ref;
        if (!store.dirty) {
          if (snap.exists) {
            var d = JSON.parse(JSON.stringify(snap.data()));
            if (d && d.customers && d.products) { S = d; if (!T[S.lang]) S.lang = 'ar'; }
          } else if (local && local.customers && local.products) {
            S = local;
          }
        }
      }
    } catch (e) { store.ref = null; }
    if (!store.ref && !store.dirty && local && local.customers && local.products) S = local;
    var l = lsLang(); if (l && T[l]) S.lang = l;
    store.loaded = true;
    store.state = store.ref ? 'saved' : 'local';
    if (store.ref && store.dirty) flush();
    render();
  }

  /* ---------- views ---------- */
  var ICON = {
    debts: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>',
    stock: '<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>',
    today: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
  };

  function header() {
    var langs = ['ar', 'fr', 'en'];
    return '<header class="top"><div class="brand"><h1>' + esc(t().app) + '</h1><p>' + esc(t().sub) + '</p></div>' +
      '<div class="seg" dir="ltr" role="group" aria-label="' + esc(t().lang) + '">' +
      langs.map(function (l) { return '<button data-a="lang" data-id="' + l + '" aria-pressed="' + (S.lang === l) + '">' + { ar: 'عربي', fr: 'FR', en: 'EN' }[l] + '</button>'; }).join('') +
      '</div></header>' +
      '<div class="status" id="status"></div>' +
      (S.demo ? '<div class="banner"><span>' + esc(t().demo) + '</span><button data-a="clearDemo">' + esc(t().clearDemo) + '</button></div>' : '');
  }

  function viewDebts() {
    var rows = S.customers.slice().sort(function (a, b) { return bal(b) - bal(a); });
    var total = 0, n = 0;
    S.customers.forEach(function (c) { var b = bal(c); if (b > 0) { total += b; n++; } });
    var list = rows.length ? '<ul class="list" id="clist">' + rows.map(function (c) {
      var b = bal(c);
      return '<li data-name="' + esc(c.name.toLowerCase()) + '"><button class="row" data-a="openC" data-id="' + c.id + '"><span class="nm">' + esc(c.name) + '</span><span class="lead"></span>' +
        (b > 0 ? '<span class="amt debt">' + money(b) + '</span>' : '<span class="chip ok">' + esc(t().settled) + '</span>') + '</button></li>';
    }).join('') + '</ul>' : '<div class="list"><div class="empty">' + esc(t().noCustomers) + '</div></div>';
    return '<section class="hero"><div class="lbl">' + esc(t().owedTotal) + '</div><div class="big">' + fmt(total) + '<small>' + esc(t().dh) + '</small></div><div class="sub">' + esc(fill(t().owingCount, { n: n })) + '</div></section>' +
      '<div class="tools"><input type="search" id="q" placeholder="' + esc(t().search) + '" aria-label="' + esc(t().search) + '"><button class="btn" data-a="openAddC">+ ' + esc(t().addCustomer) + '</button></div>' + list;
  }

  function viewStock() {
    var low = S.products.filter(function (p) { return p.qty < p.min; }).length;
    var rows = S.products.slice().sort(function (a, b) { return (a.qty < a.min ? 0 : 1) - (b.qty < b.min ? 0 : 1) || a.name.localeCompare(b.name); });
    var list = rows.length ? '<ul class="list">' + rows.map(function (p) {
      var isLow = p.qty < p.min;
      return '<li class="prod"><div class="head"><span class="nm">' + esc(p.name) + '</span><span class="chip ' + (isLow ? 'low' : 'ok') + '">' + esc(isLow ? t().low : t().ok) + '</span></div>' +
        '<div class="ctl"><div class="step" dir="ltr"><button data-a="qty" data-id="' + p.id + '" data-d="-1" aria-label="-1">−</button><output>' + fmt(p.qty) + '</output><button data-a="qty" data-id="' + p.id + '" data-d="1" aria-label="+1">+</button></div>' +
        '<label class="minbox">' + esc(t().min) + '<input type="number" inputmode="numeric" min="0" id="min-' + p.id + '" data-ch="min" data-id="' + p.id + '" value="' + p.min + '"></label>' +
        '<button class="x ' + (ui.armed === 'p' + p.id ? 'armed' : '') + '" data-a="delP" data-id="' + p.id + '">' + esc(ui.armed === 'p' + p.id ? t().confirmDel : t().del) + '</button></div></li>';
    }).join('') + '</ul>' : '<div class="list"><div class="empty">' + esc(t().noProducts) + '</div></div>';
    return '<section class="hero"><div class="lbl">' + esc(t().shopList) + '</div><div class="big" style="color:' + (low ? 'var(--debt)' : 'var(--ok)') + '">' + fmt(low) + '<small>' + esc(t().low) + '</small></div></section>' +
      '<div class="tools"><button class="btn" data-a="openAddP">+ ' + esc(t().addProduct) + '</button></div>' + list;
  }

  function viewToday() {
    var s0 = dayStart(), d = 0, p = 0;
    S.customers.forEach(function (c) { c.tx.forEach(function (x) { if (x.t >= s0) { if (x.type === 'debt') d += x.amt; else p += x.amt; } }); });
    var top = S.customers.filter(function (c) { return bal(c) > 0; }).sort(function (a, b) { return bal(b) - bal(a); }).slice(0, 3);
    var low = S.products.filter(function (x) { return x.qty < x.min; });
    return '<section class="card"><div class="kv"><span>' + esc(t().todayDebts) + '</span><span class="amt debt">' + money(d) + '</span></div>' +
      '<div class="kv"><span>' + esc(t().todayPaid) + '</span><span class="amt ok">' + money(p) + '</span></div></section>' +
      '<section class="card"><h2>' + esc(t().topDebtors) + '</h2>' + (top.length ? top.map(function (c) { return '<div class="kv"><span>' + esc(c.name) + '</span><span class="amt debt">' + money(bal(c)) + '</span></div>'; }).join('') : '<div class="mini">—</div>') + '</section>' +
      '<section class="card"><h2>' + esc(t().shopList) + '</h2>' + (low.length ? low.map(function (x) { return '<div class="kv"><span>' + esc(x.name) + '</span><span class="mini">' + fmt(x.qty) + ' / ' + fmt(x.min) + '</span></div>'; }).join('') + '<button class="btn ghost" data-a="copyList">' + esc(ui.toast === 'copied' ? t().copied : t().copyList) + '</button>' : '<div class="mini">' + esc(t().nothingLow) + '</div>') + '</section>' +
      '<section class="card"><div class="field"><label for="shop">' + esc(t().shopName) + '</label><input type="text" id="shop" data-ch="shop" value="' + esc(S.shop) + '"></div></section>';
  }

  function sheetHTML() {
    var sh = ui.sheet; if (!sh) return '';
    var body = '';
    if (sh.type === 'addC') {
      body = '<div class="hd"><h2>' + esc(t().addCustomer) + '</h2><button class="x" data-a="close">' + esc(t().close) + '</button></div>' +
        '<form id="f-cust" class="card"><div class="field"><label for="c-name">' + esc(t().name) + '</label><input type="text" id="c-name" autocomplete="off"></div>' +
        '<div class="field"><label for="c-phone">' + esc(t().phone) + '</label><input type="tel" id="c-phone" inputmode="tel" placeholder="' + esc(t().phoneHint) + '"></div>' +
        (ui.err ? '<div class="mini" style="color:var(--debt)">' + esc(ui.err) + '</div>' : '') +
        '<div class="pair"><button type="button" class="btn ghost" data-a="close">' + esc(t().cancel) + '</button><button class="btn" type="submit">' + esc(t().save) + '</button></div></form>';
    } else if (sh.type === 'addP') {
      body = '<div class="hd"><h2>' + esc(t().addProduct) + '</h2><button class="x" data-a="close">' + esc(t().close) + '</button></div>' +
        '<form id="f-prod" class="card"><div class="field"><label for="p-name">' + esc(t().product) + '</label><input type="text" id="p-name" autocomplete="off"></div>' +
        '<div class="pair"><div class="field"><label for="p-qty">' + esc(t().qty) + '</label><input type="number" inputmode="numeric" min="0" id="p-qty" value="0"></div>' +
        '<div class="field"><label for="p-min">' + esc(t().min) + '</label><input type="number" inputmode="numeric" min="0" id="p-min" value="3"></div></div>' +
        (ui.err ? '<div class="mini" style="color:var(--debt)">' + esc(ui.err) + '</div>' : '') +
        '<div class="pair"><button type="button" class="btn ghost" data-a="close">' + esc(t().cancel) + '</button><button class="btn" type="submit">' + esc(t().save) + '</button></div></form>';
    } else if (sh.type === 'cust') {
      var c = findC(sh.id); if (!c) return '';
      var b = bal(c), num = waNumber(c.phone);
      var text = fill(t().msg, { name: c.name, from: S.shop ? t().fromWord + S.shop : '', amount: fmt(b) });
      var remind = (b > 0 && num)
        ? '<a class="btn ok" style="text-align:center;text-decoration:none;display:block" target="_blank" rel="noopener" href="https://wa.me/' + num + '?text=' + encodeURIComponent(text) + '">' + esc(t().remind) + '</a>'
        : '<div class="mini">' + esc(b > 0 ? t().needPhone : t().settled) + '</div>';
      var form = '';
      if (ui.kind) {
        form = '<form id="f-tx" class="card" data-kind="' + ui.kind + '"><h2>' + esc(ui.kind === 'debt' ? t().addDebt : t().addPay) + '</h2>' +
          '<div class="field"><label for="t-amt">' + esc(t().amount) + ' (' + esc(t().dh) + ')</label><input type="number" inputmode="decimal" min="0" step="any" id="t-amt"></div>' +
          '<div class="field"><label for="t-note">' + esc(t().note) + '</label><input type="text" id="t-note" autocomplete="off"></div>' +
          (ui.err ? '<div class="mini" style="color:var(--debt)">' + esc(ui.err) + '</div>' : '') +
          '<div class="pair"><button type="button" class="btn ghost" data-a="kind" data-id="">' + esc(t().cancel) + '</button><button class="btn ' + (ui.kind === 'debt' ? 'debt' : 'ok') + '" type="submit">' + esc(t().save) + '</button></div></form>';
      }
      var hist = c.tx.slice().sort(function (x, y) { return y.t - x.t; }).map(function (x) {
        var key = 't' + x.id;
        return '<li><span class="d">' + esc(dateStr(x.t)) + '</span><span class="n">' + esc(x.type === 'debt' ? t().debt : t().paid) + (x.note ? ' · ' + esc(x.note) : '') + '</span>' +
          '<span class="amt ' + (x.type === 'debt' ? 'debt' : 'ok') + '">' + (x.type === 'debt' ? '+' : '−') + fmt(x.amt) + '</span>' +
          '<button class="x ' + (ui.armed === key ? 'armed' : '') + '" data-a="delT" data-id="' + c.id + '" data-id2="' + x.id + '" aria-label="' + esc(t().del) + '">' + (ui.armed === key ? esc(t().confirmDel) : '×') + '</button></li>';
      }).join('');
      body = '<div class="hd"><div><h2>' + esc(c.name) + '</h2><div class="amt ' + (b > 0 ? 'debt' : 'ok') + '" style="font-size:1.6rem">' + (b > 0 ? money(b) : esc(t().settled)) + '</div></div><button class="x" data-a="close">' + esc(t().close) + '</button></div>' +
        remind +
        '<div class="pair"><button class="btn debt" data-a="kind" data-id="debt">' + esc(t().addDebt) + '</button><button class="btn ok" data-a="kind" data-id="pay">' + esc(t().addPay) + '</button></div>' + form +
        '<div class="card"><h2>' + esc(t().history) + '</h2>' + (c.tx.length ? '<ul class="hist">' + hist + '</ul>' : '<div class="mini">—</div>') + '</div>' +
        '<div class="card"><div class="mini">' + esc(t().editHint) + '</div><div class="pair"><div class="field"><label for="e-name">' + esc(t().name) + '</label><input type="text" id="e-name" data-ch="cname" data-id="' + c.id + '" value="' + esc(c.name) + '"></div>' +
        '<div class="field"><label for="e-phone">' + esc(t().phone) + '</label><input type="tel" id="e-phone" data-ch="cphone" data-id="' + c.id + '" inputmode="tel" value="' + esc(c.phone) + '"></div></div>' +
        '<button class="x ' + (ui.armed === 'c' + c.id ? 'armed' : '') + '" data-a="delC" data-id="' + c.id + '">' + esc(ui.armed === 'c' + c.id ? t().confirmDel : t().del) + '</button></div>';
    }
    return '<div class="ov" data-a="closeBg"><div class="sheet" role="dialog" aria-modal="true">' + body + '</div></div>';
  }

  function tabs() {
    var items = [['debts', t().tabDebts], ['stock', t().tabStock], ['today', t().tabToday]];
    return '<nav class="tabs" aria-label="tabs">' + items.map(function (i) {
      return '<button data-a="tab" data-id="' + i[0] + '"' + (ui.tab === i[0] ? ' aria-current="page"' : '') + '>' + ICON[i[0]] + '<span>' + esc(i[1]) + '</span></button>';
    }).join('') + '</nav>';
  }

  function render() {
    if (!S) return;
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t().app;
    var view = ui.tab === 'debts' ? viewDebts() : ui.tab === 'stock' ? viewStock() : viewToday();
    $app.innerHTML = header() + view + tabs() + sheetHTML();
    paintStatus();
    var first = $app.querySelector('.sheet form input');
    if (first && ui.sheet && !ui.kindFocused) { first.focus(); }
  }

  function commit() { save(); render(); }

  function confirmed(key) {
    if (ui.armed === key) { ui.armed = null; return true; }
    ui.armed = key; render();
    setTimeout(function () { if (ui.armed === key) { ui.armed = null; render(); } }, 3000);
    return false;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el || !S) return;
    var a = el.dataset.a, id = el.dataset.id, id2 = el.dataset.id2;
    if (a === 'closeBg' && e.target !== el) return;
    if (a === 'tab') { ui.tab = id; ui.sheet = null; render(); }
    else if (a === 'lang') { S.lang = id; lsSetLang(id); commit(); }
    else if (a === 'clearDemo') { S.demo = false; S.customers = []; S.products = []; commit(); }
    else if (a === 'openAddC') { ui.sheet = { type: 'addC' }; ui.err = ''; render(); }
    else if (a === 'openAddP') { ui.sheet = { type: 'addP' }; ui.err = ''; render(); }
    else if (a === 'openC') { ui.sheet = { type: 'cust', id: id }; ui.kind = null; ui.err = ''; render(); }
    else if (a === 'close' || a === 'closeBg') { ui.sheet = null; ui.kind = null; ui.err = ''; render(); }
    else if (a === 'kind') { ui.kind = id || null; ui.err = ''; render(); }
    else if (a === 'qty') {
      var p = S.products.filter(function (x) { return x.id === id; })[0];
      if (p) { p.qty = Math.max(0, p.qty + Number(el.dataset.d)); commit(); }
    }
    else if (a === 'delP') { if (confirmed('p' + id)) { S.products = S.products.filter(function (x) { return x.id !== id; }); commit(); } }
    else if (a === 'delC') { if (confirmed('c' + id)) { S.customers = S.customers.filter(function (x) { return x.id !== id; }); ui.sheet = null; commit(); } }
    else if (a === 'delT') { if (confirmed('t' + id2)) { var c = findC(id); if (c) { c.tx = c.tx.filter(function (x) { return x.id !== id2; }); commit(); } } }
    else if (a === 'copyList') {
      var txt = S.products.filter(function (x) { return x.qty < x.min; }).map(function (x) { return '- ' + x.name; }).join('\n');
      var done = function () { ui.toast = 'copied'; render(); setTimeout(function () { ui.toast = ''; render(); }, 2000); };
      try { navigator.clipboard.writeText(txt).then(done, function () {}); } catch (err) {}
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault(); if (!S) return;
    var f = e.target.id;
    if (f === 'f-cust') {
      var name = document.getElementById('c-name').value.trim();
      if (!name) { ui.err = t().nameReq; render(); return; }
      var c = { id: uid(), name: name, phone: document.getElementById('c-phone').value.trim(), tx: [] };
      S.customers.push(c); ui.sheet = { type: 'cust', id: c.id }; ui.err = ''; commit();
    } else if (f === 'f-prod') {
      var pn = document.getElementById('p-name').value.trim();
      if (!pn) { ui.err = t().nameReq; render(); return; }
      S.products.push({ id: uid(), name: pn, qty: Math.max(0, Number(document.getElementById('p-qty').value) || 0), min: Math.max(0, Number(document.getElementById('p-min').value) || 0) });
      ui.sheet = null; ui.err = ''; commit();
    } else if (f === 'f-tx') {
      var amt = Number(document.getElementById('t-amt').value);
      if (!(amt > 0)) { ui.err = t().invalid; render(); return; }
      var cu = findC(ui.sheet.id); if (!cu) return;
      cu.tx.push({ id: uid(), t: Date.now(), type: e.target.dataset.kind, amt: Math.round(amt * 100) / 100, note: document.getElementById('t-note').value.trim() });
      ui.kind = null; ui.err = ''; commit();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') {
      var v = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#clist li').forEach(function (li) { li.hidden = v && li.dataset.name.indexOf(v) < 0; });
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target, k = el.dataset && el.dataset.ch; if (!k || !S) return;
    if (k === 'min') { var p = S.products.filter(function (x) { return x.id === el.dataset.id; })[0]; if (p) { p.min = Math.max(0, Number(el.value) || 0); commit(); } }
    else if (k === 'shop') { S.shop = el.value.trim(); save(); }
    else if (k === 'cname') { var c = findC(el.dataset.id); if (c && el.value.trim()) { c.name = el.value.trim(); save(); } }
    else if (k === 'cphone') { var c2 = findC(el.dataset.id); if (c2) { c2.phone = el.value.trim(); commit(); } }
  });

  /* ---------- boot ---------- */
  var l0 = lsLang();
  var firstLang = l0 && T[l0] ? l0 : ((navigator.language || 'ar').slice(0, 2) === 'fr' ? 'fr' : (navigator.language || '').slice(0, 2) === 'en' ? 'en' : 'ar');
  S = demoState(firstLang);
  render();
  initStore();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('kridi-sw.js').catch(function () {});
}
</script>
</body>
</html>
